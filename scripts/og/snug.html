<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@400;500;600&display=swap" />
  <!--
    The patchwork quilt and hand-sewn stitching from
    src/hackathons/daily/bryce/snug/{quilt,stitches}.ts — palette and patch
    styles kept in step with those files. Seeded, so re-rendering is stable.
  -->
  <style>
    html,
    body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #f4ead6;
    }

    #stage {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    .card {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-1.4deg);
      width: 620px;
      padding: 44px 0 52px;
      text-align: center;
      background: #f4ead6;
      border-radius: 26px;
      box-shadow: 0 18px 44px rgba(74, 44, 34, .32);
    }

    .word {
      font: 700 164px/0.9 Caveat, cursive;
      color: #7b3b2e;
    }

    .sub {
      margin-top: 10px;
      font: 500 26px Fredoka, system-ui, sans-serif;
      letter-spacing: .04em;
      color: #4a2c22;
      opacity: .85;
    }
  </style>
</head>

<body>
  <div id="stage">
    <svg id="quilt" width="1200" height="630"></svg>
    <div class="card">
      <div class="word">Snug</div>
      <div class="sub">a daily piece-fitting puzzle</div>
    </div>
    <svg id="binding" width="1200" height="630" style="position:absolute;inset:0;pointer-events:none"></svg>
  </div>

  <script>
    const FABRICS = ["#c98a7e", "#d9a84e", "#8fa77d", "#5b7a99", "#e8dcc2", "#b5653f", "#4f8a86", "#7f5d7c", "#e6cf8f", "#9c4d3e", "#a8b8c8"];
    const THREAD = "#fff6e6";
    const PATCH = 120;

    /** mulberry32, same shape as the game's seeded RNG. */
    function makeRng(seed) {
      let a = seed >>> 0;
      const next = () => {
        a = (a + 0x6d2b79f5) >>> 0;
        let t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
      return { next, int: (n) => Math.floor(next() * n), range: (lo, hi) => lo + next() * (hi - lo) };
    }

    const rng = makeRng(20261008);

    const styles = [
      // Polka dots.
      (rng, a, b) => {
        let s = `<rect width="${PATCH}" height="${PATCH}" fill="${a}"/>`;
        const r = 3 + rng.int(3);
        for (let y = 0; y < 6; y++) for (let x = 0; x < 6; x++) s += `<circle cx="${x * 22 + (y % 2) * 11 + 5}" cy="${y * 22 + 10}" r="${r}" fill="${b}"/>`;
        return s;
      },
      // Gingham.
      (_rng, a, b) => {
        let s = `<rect width="${PATCH}" height="${PATCH}" fill="${b}"/>`;
        for (let i = 0; i < 6; i++) {
          s += `<rect x="${i * 22}" width="11" height="${PATCH}" fill="${a}" opacity=".55"/>`;
          s += `<rect y="${i * 22}" width="${PATCH}" height="11" fill="${a}" opacity=".55"/>`;
        }
        return s;
      },
      // Stripes.
      (rng, a, b) => {
        let s = `<rect width="${PATCH}" height="${PATCH}" fill="${a}"/>`;
        const w = 7 + rng.int(8);
        for (let i = 0; i < 10; i++) s += `<rect y="${i * (w * 2)}" width="${PATCH}" height="${w}" fill="${b}"/>`;
        return s;
      },
      // Half-square triangles.
      (_rng, a, b) => `<rect width="${PATCH}" height="${PATCH}" fill="${a}"/>` +
        `<path d="M0 0 L${PATCH} 0 L0 ${PATCH} Z" fill="${b}"/>`,
      // Nine-patch.
      (_rng, a, b) => {
        let s = `<rect width="${PATCH}" height="${PATCH}" fill="${a}"/>`;
        const c = PATCH / 3;
        for (let y = 0; y < 3; y++) for (let x = 0; x < 3; x++) if ((x + y) % 2 === 0) s += `<rect x="${x * c}" y="${y * c}" width="${c}" height="${c}" fill="${b}"/>`;
        return s;
      },
      // Plaid.
      (_rng, a, b) => {
        let s = `<rect width="${PATCH}" height="${PATCH}" fill="${a}"/>`;
        for (let i = 0; i < 4; i++) {
          s += `<rect x="${i * 30 + 6}" width="14" height="${PATCH}" fill="${b}" opacity=".5"/>`;
          s += `<rect y="${i * 30 + 14}" width="${PATCH}" height="9" fill="${b}" opacity=".45"/>`;
        }
        return s;
      },
    ];

    /**
     * A hand-sewn running stitch along a straight line: each stitch is its own
     * wobbly segment, so no two seams on the quilt look alike.
     */
    function running(x1, y1, x2, y2) {
      const len = Math.hypot(x2 - x1, y2 - y1);
      const ux = (x2 - x1) / len, uy = (y2 - y1) / len;
      const nx = -uy, ny = ux;
      let out = "";
      let t = 4;
      while (t < len - 4) {
        const stitch = rng.range(7, 11);
        const end = Math.min(t + stitch, len - 4);
        const j1 = rng.range(-1.1, 1.1), j2 = rng.range(-1.1, 1.1);
        const ax = x1 + ux * t + nx * j1, ay = y1 + uy * t + ny * j1;
        const bx = x1 + ux * end + nx * j2, by = y1 + uy * end + ny * j2;
        out += `<line x1="${ax.toFixed(1)}" y1="${ay.toFixed(1)}" x2="${bx.toFixed(1)}" y2="${by.toFixed(1)}" ` +
          `stroke="${THREAD}" stroke-width="${rng.range(2.1, 3).toFixed(1)}" stroke-linecap="round" opacity="${rng.range(.72, .95).toFixed(2)}"/>`;
        t = end + rng.range(5, 8);
      }
      return out;
    }

    // --- The quilt ------------------------------------------------------
    const cols = Math.ceil(1200 / PATCH), rows = Math.ceil(630 / PATCH);
    let defs = "", body = "", seams = "";
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const a = FABRICS[rng.int(FABRICS.length)];
        let b = FABRICS[rng.int(FABRICS.length)];
        if (b === a) b = FABRICS[(FABRICS.indexOf(a) + 3) % FABRICS.length];
        const id = `p${x}_${y}`;
        // The clip resolves in the group's own space, so it sits at the origin
        // and the translate carries both the patch and its clip into place.
        defs += `<clipPath id="${id}"><rect width="${PATCH}" height="${PATCH}"/></clipPath>`;
        body += `<g clip-path="url(#${id})" transform="translate(${x * PATCH} ${y * PATCH})">` +
          styles[rng.int(styles.length)](rng, a, b) + `</g>`;
      }
    }
    // Seams along every patch edge.
    for (let y = 1; y < rows; y++) seams += running(0, y * PATCH, 1200, y * PATCH);
    for (let x = 1; x < cols; x++) seams += running(x * PATCH, 0, x * PATCH, 630);

    document.getElementById("quilt").innerHTML =
      `<defs>${defs}</defs>${body}` +
      `<g filter="url(#none)">${seams}</g>` +
      `<rect width="1200" height="630" fill="#4a2c22" opacity=".1"/>`;

    // --- Binding around the centre card --------------------------------
    const card = document.querySelector(".card").getBoundingClientRect();
    const pad = 13;
    const L = card.left + pad, R = card.right - pad, T = card.top + pad, B = card.bottom - pad;
    document.getElementById("binding").innerHTML =
      `<g transform="rotate(-1.4 600 315)">` +
      running(L, T, R, T) + running(R, T, R, B) + running(R, B, L, B) + running(L, B, L, T) +
      `</g>`;
  </script>
</body>

</html>
